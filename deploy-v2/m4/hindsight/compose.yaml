# M4 — Hindsight (Postgres+pgvector + Go API) on vm-hindsight — V2 ea- stack
# Source: version 1/installation-deployment/M4-Memory-Knowledge-Installation-and-Deployment.md §1a
# Coexistence: V1 runs project "hindsight" (poc/hindsight-api:1.0.0, host port 8081,
# volume hindsight_hindsight-pg-data) — V2 must NOT collide with it:
#   project ea-hindsight · container names ea-hindsight-* · its own volume
#   ea-hindsight-pg-data (V2 memory starts clean) · host port 8082 (V1 keeps 8081).
name: ea-hindsight
services:
  hindsight-pg:
    container_name: ea-hindsight-pg
    image: "pgvector/pgvector:pg16"        # Postgres + pgvector extension in one image (pin)
    environment:
      POSTGRES_DB: hindsight
      POSTGRES_USER: hindsight
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASS}
    volumes:
      - "ea-hindsight-pg-data:/var/lib/postgresql/data"
      - "./initdb.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"   # CREATE EXTENSION vector; tables below
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hindsight"]
      interval: 10s
  hindsight-api:
    container_name: ea-hindsight-api
    image: "ea/hindsight-api:1.0.0"        # small Go service (built in §1b)
    environment:
      DB_DSN: "postgres://hindsight:${HINDSIGHT_DB_PASS}@hindsight-pg:5432/hindsight?sslmode=disable"
      LISTEN: "0.0.0.0:8081"
      EMBEDDINGS: ${EMBEDDING_PROVIDER}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}   # provider key — without it every write 500s
    depends_on:
      hindsight-pg:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8082:8081"   # LAN-reachable API (HINDSIGHT_URL=http://vm-hindsight:8082; UFW 8082 open to the deployment network). V1 keeps 8081.
volumes:
  ea-hindsight-pg-data: {}
