# M5 — front-of-house on vm-xa: Gateway + Manager Agent — V2 ea- stack
# Implements the M5 front-of-house §1 topology (see deploy-v2/RUNBOOK-V2-BUILD.md).
# Coexistence: the first organization runs project "m5" (poc/gateway, host 8080) on vm-xa — this build must not
# collide: project ea-m5 · container names ea-m5-* · gateway publishes 8083:8080 (the first organization keeps 8080).
name: ea-m5
services:
  gateway:
    container_name: ea-m5-gateway
    image: "ea/gateway:1.0.0"
    # Hermes Agent Gateway: tall narrow bar in the diagram — the request entry point
    ports: ["8083:8080"]
    environment:
      LISTEN: "0.0.0.0:8080"
      MANAGER_API: "http://manager:8086"
    depends_on:
      manager:
        condition: service_started
    restart: unless-stopped
  manager:
    container_name: ea-m5-manager
    image: "ea/manager:1.0.0"
    # persistent Hermes Agent (Docker Container) hosting the Manager Agent — survives across tasks
    environment:
      RABBITMQ_URL: "amqp://ea:${RABBITMQ_PASS:?set RABBITMQ_PASS in .env}@${BROKER_HOST:?set BROKER_HOST in .env}:5672"
      AGENT_LIST_REPO: "${AGENT_LIST_REPO:?set AGENT_LIST_REPO=https://github.com/arvisdev/agent-roster.git in .env}"  # owner catalog repo (manager embeds GITHUB_READ_TOKEN as x-access-token)
      GITHUB_READ_TOKEN: ${AGENT_LIST_READ_TOKEN}
      EA_TASKS_QUEUE: "ea-tasks"          # queue-direct publish (default exchange) — coexistence: bypasses the shared agent.tasks exchange so the first organization's bridge cannot race first-start
      RESPONSE_QUEUE: "ea-tasks.response"
      REPO_TARGET: "repos/ea-demo-repo"   # project repo the manager's tasks write to (manager env contract)
      REPORTS_DIR: "/reports"
    volumes: ["/opt/ea/reports:/reports"]     # human-report artifacts land here
    restart: unless-stopped

  # CoS — persistent Chief-of-Staff Hermes profile (M1/TP-V2-M1): the agent
  # proposes, the owner disposes; the Go manager validates. Resident,
  # reboot-durable (D12 board state), gateway published on 8084 (desktop's
  # named remote connection; 8083 is the ea gateway). Env = the M1 §5
  # allow-list + the owner-amended OpenRouter key (ledger entry 15).
  cos:
    container_name: ea-m5-cos
    image: "ea/hermes-ephemeral:1.0.0"
    entrypoint: /profile/cos-entrypoint.sh
    restart: unless-stopped
    init: true
    ports:
      - "8084:8080"
    environment:
      MODEL_API_BASE: "http://${BROKER_HOST}:9999"
      MODEL_API_TOKEN: "${LLM_PROXY_COS_TOKEN}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      MODEL_DEFAULT: "z-ai/glm-5.3-flash"
      ANTHROPIC_BASE_URL: "http://${BROKER_HOST}:9999"
      ANTHROPIC_API_KEY: "${LLM_PROXY_COS_TOKEN}"
      GATEWAY_SESSION_TOKEN: "${COS_SESSION_TOKEN}"
      HERMES_DASHBOARD_SESSION_TOKEN: "${COS_SESSION_TOKEN}"
      GATEWAY_API_TOKEN: "${COS_API_TOKEN}"
      GATEWAY_URL: "http://gateway:8080"
      HINDSIGHT_URL: "http://${HINDSIGHT_HOST}:8082"
      HINDSIGHT_WRITE_TOKEN: "${HINDSIGHT_WRITE_TOKEN}"
      # D12 board/state durability: the profile home (kanban board, sessions,
      # skills) must live on the bind-mounted volume, not the container FS —
      # a recreate otherwise wipes the board (observed 2026-11-22/23).
      HERMES_HOME: "/state"
      AGENTS_MD: "/profile/AGENTS.md"
    volumes:
      - /opt/ea/cos/profile:/profile:ro
      - /opt/ea/cos/profile/git-credentials:/root/.git-credentials:ro
      - /opt/ea/cos/state:/state
      - /opt/ea/cos/roster:/work/roster:ro
      - /opt/ea/repos:/work/repos
