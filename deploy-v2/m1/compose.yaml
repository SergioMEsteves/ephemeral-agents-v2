# M1 — topic-bridge deployment on vm-xb
# Source: version 1/installation-deployment/M1-Adapter-Installation-and-Deployment.md §3
# ea-named compose project (`m1` — a distinct project name keeps the V2
# containers from colliding with any other project on the host).
name: ea-m1
services:
  topic-bridge:
    image: "ea/topic-bridge:1.0.0"
    environment:
      # password interpolated from .env (RABBITMQ_PASS, written by install §3 /
      # copied from deploy-v2/m0/rabbitmq/.env — same password everywhere) —
      # same compose network as M0's rabbitmq, so the short service name resolves;
      # M5's manager runs on vm-xa and uses the routable host name vm-xb:5672 instead
      RABBITMQ_URL: "amqp://ea:${RABBITMQ_PASS:?set RABBITMQ_PASS in .env}@rabbitmq:5672/"
      TEMPORAL_ADDR: "${EA_TEMPORAL_ADDR:-temporal:7233}"
      TEMPORAL_NAMESPACE: default
      TASKS_EXCHANGE: agent.tasks
      TASKS_QUEUE: ea-tasks
      DLQ_QUEUE: ea-tasks.dlq
    # NOTE: rabbitmq/temporal are M0 compose projects, NOT services in this file —
    # depends_on cannot reach across projects. The bridge reconnects on start
    # (restart: unless-stopped); M1 §0's prereq checks are the real gate.
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
# shared external network — created by install.sh (ea-net); M0 containers are
# connected to it with aliases rabbitmq / temporal (dns on user networks
# resolves aliases, not compose service names across projects)
networks:
  default:
    external: true
    name: ea-net
