# M2 — lifecycle + worker deployment on vm-xb
# Source: version 1/installation-deployment/M2-Lifecycle-Installation-and-Deployment.md §2
# ea-named compose project (V1's /opt/poc/deploy/m2 project is `m2` — a distinct
# project name keeps the V2 containers from colliding with the live V1 stack).
name: ea-m2
services:
  lifecycle:
    image: "ea/lifecycle:1.0.0"
    environment:
      DOCKER_HOST: "unix:///var/run/docker.sock"
      LISTEN: "0.0.0.0:8090"                  # compose-network only (loopback would lock the worker out)
      REAPER_INTERVAL: "30s"
      EA_TTL_DEFAULT: "900s"                  # TTL default when the message carries no ttl_s (owner-settled hybrid). Units: the lifecycle config takes a Go duration string ("900s"); message ttl_s is integer seconds
      EA_IMAGE: "ea/executor-stub:1.0.0"     # pinned — no pulls at activity time
      # M3 §2' — EA_IMAGE is a config switch per executor type; the stub pin
      # stays until the M3 executor tags pass (rollback rule, M3 §6)
      EA_IMAGE_HERMES: "${EA_REGISTRY:?set EA_REGISTRY=<registry-host>:5000 in .env}/ea/hermes-ephemeral@sha256:b320a7aa610f8be002b64216b3b8bed39b200497a65da364ed447405b285ba25"
      EA_IMAGE_CODER: "${EA_REGISTRY:?set EA_REGISTRY=<registry-host>:5000 in .env}/ea/claude-coder@sha256:2569bcdba764fece9197c5473063ad7c45ddc27c4b89d8323bd4500f6aff9f2c"
      EA_EXECUTOR_DEFAULT: "hermes"              # M5 §4: executor when the message omits it (stub = rollback)
      EA_DOCKER_DEBUG: "true"                   # M3 debug: log exact docker run args
      # M3 §2 — per-run env sourced from the secret file (never in git/images);
      # file must exist before M3 gate runs (install.sh §1 verifies)
    env_file:
      - /opt/ea/secrets/m3.env                       # M3 §2 per-run secrets (never in git/images)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/opt/ea/deploy/m3:/opt/ea/deploy/m3:ro"   # M3 §1c: token-issuance script
      - "/opt/ea/secrets:/opt/ea/secrets:ro"          # M3 §1c: app-key.pem (read-only)   # rw: lifecycle spawns/reaps containers
      - "/var/ea/tasks:/var/ea/tasks"               # per-task log volume (§4 retention)
    restart: unless-stopped
    # deploy gate (deploy-v2/m2/install.sh): the service entrypoint RUNS `docker image inspect ea/executor-stub:1.0.0`
    # on boot and refuses to serve until the pinned image exists locally (the no-pull rule, enforced).
  worker:
    image: "ea/worker:1.0.0"
    # Dockerfile.services shares one ENTRYPOINT (lifecycle); the worker image
    # must run the worker binary — override here (the doc's two-images-one-build
    # transcription omitted the role split)
    entrypoint: ["/usr/local/bin/worker"]
    environment:
      TEMPORAL_ADDR: "${EA_TEMPORAL_ADDR:-temporal:7233}"
      LIFECYCLE_API: "http://lifecycle:8090"     # same compose project; expose the API to this network
      EA_DOCKER_DEBUG: "true"                    # M3 debug: log exact docker run args
      # response publisher (M2 §1c) — declare ea-tasks.response (M0 §3)
      RABBITMQ_URL: "amqp://ea:${RABBITMQ_PASS:?set RABBITMQ_PASS in .env}@rabbitmq:5672/"
    depends_on: [lifecycle]
    restart: unless-stopped
# shared external network (ea-net) — M0 containers carry the rabbitmq/temporal
# aliases; same wiring as M1 (created/connected by deploy-v2/m1/install.sh and by
# deploy-v2/m2/install.sh's §3 — idempotent)
networks:
  default:
    external: true
    name: ea-net
