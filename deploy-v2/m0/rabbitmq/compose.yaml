# M0 — RabbitMQ (Topic) on vm-xb
# Implements the M0 chassis §3 broker topology (see deploy-v2/RUNBOOK-V2-BUILD.md).
# Secrets come from .env (gitignored, generated: openssl rand -hex 16) — never committed.
# ea-named compose project (`m0` — a distinct project name keeps the V2
# containers from colliding with any other project on the host).
name: ea-m0-rabbitmq
services:
  rabbitmq:
    image: "rabbitmq:4-management-alpine"   # pin exact tag in image-tags.env
    hostname: rabbitmq
    ports:
      - "5672:5672"                        # AMQP must be reachable cross-VM (M5 manager on vm-xa publishes here)
      - "15672:15672"  # mgmt UI LAN-open per owner request 2026-11-08 (was loopback-only M0 design)
    environment:
      RABBITMQ_DEFAULT_USER: ea
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}   # from .env (gitignored, generated: openssl rand -hex 16)
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    networks:
      ea-net:
        aliases: [rabbitmq]   # bridge/worker/lifecycle resolve "rabbitmq" on ea-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
volumes:
  rabbitmq-data: {}
networks:
  ea-net:
    external: true
